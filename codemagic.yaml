workflows:
  ios-workflow:
    name: vxkit
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Fix Ruby for CocoaPods
        script: |
        rbenv global 3.2.2


      - name: Pod install
        script: |
          cd ios
          pod install
          cd ..

      - name: Flutter build ipa
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
