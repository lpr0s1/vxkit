workflows:
  ios-workflow:
    name: Build vxkit
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:

      - name: Nettoyage
        script: |
          flutter clean
          flutter pub get

      - name: Regénérer uniquement le projet Xcode
        script: |
          flutter create --platforms=ios .

      - name: Préparation iOS
        script: |
          cd ios
          pod install
          cd ..

      - name: Build IPA sans signature
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
