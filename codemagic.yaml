workflows:
  ios-workflow:
    name: vxkit
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter clean
        script: flutter clean

      - name: Regenerate Flutter iOS intermediates
        script: flutter pub get

      - name: Ensure Flutter iOS files exist
        script: |
          if [ ! -f "ios/Runner/Base.lproj/Main.storyboard" ]; then
            mkdir -p ios/Runner/Base.lproj
            cat > ios/Runner/Base.lproj/Main.storyboard <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0">
    <scenes/>
</document>
EOF
          fi

          if [ ! -f "ios/Runner/Base.lproj/LaunchScreen.storyboard" ]; then
            mkdir -p ios/Runner/Base.lproj
            cat > ios/Runner/Base.lproj/LaunchScreen.storyboard <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0">
    <scenes/>
</document>
EOF
          fi

      - name: Fix Ruby for CocoaPods
        script: rbenv global 3.2.2

      - name: Pod install
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Flutter build ipa
        script: flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
